<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | N'Djamena Apartments</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/fontawesome/css/all.min.css">
</head>
<body class="admin-body" style="display: flex; align-items: center; justify-content: center;">
  <div class="admin-login-box">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <i class="fas fa-building" style="font-size: 2.5rem; color: #1e6f5c;"></i>
      <h2 style="margin-top: 0.5rem;">Admin Portal</h2>
      <p style="color: #5a6e7c;">Sign in to manage properties</p>
    </div>
    <input type="text" id="username" placeholder="Username" style="width: 100%; padding: 0.8rem; border-radius: 2rem; border: 1px solid #cbd5e1; margin-bottom: 1rem;">
    <input type="password" id="password" placeholder="Password" style="width: 100%; padding: 0.8rem; border-radius: 2rem; border: 1px solid #cbd5e1; margin-bottom: 1.5rem;">
    <button id="loginBtn" class="admin-btn" style="width: 100%;">Login</button>
    <div id="error" class="error" style="margin-top: 1rem; text-align: center;"></div>
  </div>
  <script src="/js/admin.js"></script>
</body>
</html>
